[project]
name = "bgmi-analyzer"
version = "0.1.0"
description = "Turn a BGMI esports map-stream VOD into per-team drops, rotations and zone play."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "opencv-python-headless>=4.10",
  "rapidocr-onnxruntime>=1.3",
  "rapidfuzz>=3.9",
  "imageio-ffmpeg>=0.5",
  "yt-dlp>=2025.1.1",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bgmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
